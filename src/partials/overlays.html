<!-- Global overlays: command palette, search, shortcuts help, confirm, toasts -->
<div class="command-palette" id="command-palette" role="dialog" aria-modal="true" aria-label="پالت فرمان" hidden>
  <div class="command-palette__backdrop" data-command-close></div>
  <div class="command-palette__panel" role="document">
    <div class="command-palette__search">
      <i class="bi bi-search" aria-hidden="true"></i>
      <input type="text" class="command-palette__input" placeholder="جستجو یا اجرای دستور…" aria-label="جستجوی دستور" data-command-input autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="command-palette__body" data-command-results role="listbox" aria-label="نتایج"></div>
    <div class="command-palette__foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="ui.navigate">پیمایش</span></span>
      <span><kbd>Enter</kbd> <span data-i18n="ui.select">انتخاب</span></span>
      <span><kbd>Esc</kbd> <span data-i18n="ui.close">بستن</span></span>
    </div>
  </div>
</div>

<!-- Toast host -->
<div class="toast-host" data-toast-host aria-live="polite" aria-atomic="true"></div>

<!-- Mobile sidebar backdrop -->
<div class="sidebar-backdrop" data-sidebar-backdrop hidden></div>
